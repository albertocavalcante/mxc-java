name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS exercises a real Seatbelt sandbox, Linux a real Bubblewrap sandbox.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: enable Bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --unshare-user true && echo "bubblewrap works"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - id: ref
        run: echo "ref=$(cat MXC_REF)" >> "$GITHUB_OUTPUT"

      - name: cache native library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mxc
          key: mxc-${{ runner.os }}-${{ runner.arch }}-${{ steps.ref.outputs.ref }}

      - name: build libmxc_ffi
        run: just native

      - name: ci gate
        run: just ci

  # Experimental: proves libmxc_ffi.dll builds and loads through Panama on Windows.
  # Sandbox backends need Windows 11 features the hosted runners usually lack, so
  # sandbox tests skip there.
  windows:
    name: load (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: build libmxc_ffi
        run: |
          git clone --filter=blob:none https://github.com/microsoft/mxc .mxc
          git -C .mxc checkout --quiet "$(cat MXC_REF)"
          cargo build --release -p mxc_ffi --manifest-path .mxc/src/Cargo.toml

      - name: verify
        env:
          MXC_FFI_DIR: ${{ github.workspace }}/.mxc/src/target/release
        run: ./mvnw -B verify
