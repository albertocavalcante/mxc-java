output:
  - meta
  - summary
  - success

pre-commit:
  parallel: true
  commands:
    java-fmt:
      glob: "*.java"
      run: just fmt-check
      fail_text: "Run 'just fmt' before committing"

    java-lint:
      glob: "{*.java,config/checkstyle.xml}"
      run: just lint
      fail_text: "Fix Checkstyle findings (no star imports, braces required, public Javadoc)"

    java-build:
      glob: "{*.java,pom.xml}"
      run: just build
      fail_text: "The project must compile (with -Xlint:all -Werror) before committing"

commit-msg:
  commands:
    conventional-commit:
      run: |
        first_line="$(sed -n '1p' "{1}")"
        case "$first_line" in
          Merge\ *|Revert\ *|fixup!\ *|squash!\ *) exit 0 ;;
        esac
        printf '%s\n' "$first_line" |
          grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+' || {
            printf '%s\n' "commit message must follow Conventional Commits, e.g. feat(process): add PTY support" >&2
            exit 1
          }

    subject-length:
      run: |
        first_line="$(sed -n '1p' "{1}")"
        test "${#first_line}" -le 72 || {
          printf '%s\n' "commit subject must be at most 72 characters" >&2
          exit 1
        }

pre-push:
  commands:
    test:
      run: just test
      fail_text: "Tests must pass before pushing"
